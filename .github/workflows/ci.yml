name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://iskoala.com
  NEXT_PUBLIC_APP_URL_SCHEME: koala
  NEXT_PUBLIC_ANDROID_PACKAGE_ID: com.iskoala.koala
  API_URL: https://api-staging.iskoala.com
  APP_VERSION: 0.1.0

jobs:
  quality:
    name: Kalite kapısı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
