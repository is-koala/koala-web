name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://iskoala.com
  NEXT_PUBLIC_APP_URL_SCHEME: koala
  NEXT_PUBLIC_ANDROID_PACKAGE_ID: com.iskoala.koala
  API_URL: https://api-staging.iskoala.com
  APP_VERSION: 0.1.0
  APPLE_APP_IDENTIFIER: ${{ vars.APPLE_APP_IDENTIFIER }}
  ANDROID_APP_LINKS_PACKAGE_NAME: ${{ vars.ANDROID_APP_LINKS_PACKAGE_NAME }}
  ANDROID_APP_LINKS_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_APP_LINKS_SHA256_CERT_FINGERPRINTS }}
  NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_JS_KEY }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
  NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  quality:
    name: Kalite kapısı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
